name: Build filters

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DNS filter
        run: python3 build/build_dns.py

      - name: Build ad filter
        run: python3 build/build_ad.py

      - name: Build iOS/Safari ad filter
        run: python3 build/build_ad_ios.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dns/filter.txt ad/filter.txt ad/filter-ios.txt
          for f in sources/280blocker_dns.cache.txt sources/280blocker_ad.cache.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: rebuild merged dns and ad filters"
          git push
