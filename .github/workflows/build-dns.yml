name: Build DNS filter

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged DNS filter
        run: python3 build/build_dns.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet dns/filter.txt; then
            echo "No changes to dns/filter.txt"
            exit 0
          fi
          git add dns/filter.txt
          if [ -f sources/280blocker.cache.txt ]; then
            git add sources/280blocker.cache.txt
          fi
          git commit -m "chore(dns): rebuild merged filter"
          git push
